name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hygiene tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Only zizmor + pinact — do not install terraform/just/jq here.
          install_args: zizmor pinact

      - name: Scan workflows (zizmor + pinact)
        run: |
          zizmor .github/dependabot.yml .github/workflows/*.yml
          pinact run --verify .github/workflows/*.yml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Soft-skip or run Terraform checks
        run: |
          # Soft-skip unless root-module HCL exists. This template CI assumes a
          # single root module at / (root *.tf / *.tf.json only; not nested paths).
          shopt -s nullglob
          root_hcl=(*.tf *.tf.json)
          if (( ${#root_hcl[@]} == 0 )); then
            echo "No root *.tf / *.tf.json — skipping Terraform checks (template scaffold)."
            exit 0
          fi
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
