name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Scan workflows (zizmor + pinact)
        run: |
          zizmor .github/dependabot.yml .github/workflows/*.yml
          pinact run --verify .github/workflows/*.yml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Soft-skip or run Terraform checks
        run: |
          if ! find . -name '*.tf' -not -path './.terraform/*' -print -quit | grep -q .; then
            echo "No *.tf yet — skipping Terraform checks (template scaffold)."
            exit 0
          fi
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
